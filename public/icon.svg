<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- NuPhy IO mark: settings rows + accent control -->
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #1d1d1f; }
      .fg { fill: #ffffff; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #ffffff; }
      .fg { fill: #1d1d1f; }
    }
  </style>
  <rect class="bg" width="180" height="180" rx="40" />
  <!-- three setting rows -->
  <rect class="fg" x="36" y="48" width="72" height="14" rx="7" />
  <rect class="fg" x="36" y="83" width="72" height="14" rx="7" />
  <rect class="fg" x="36" y="118" width="72" height="14" rx="7" />
  <!-- control dots: first accent green (iOS success) -->
  <circle cx="132" cy="55" r="12" fill="#34C759" />
  <circle class="fg" cx="132" cy="90" r="12" />
  <circle class="fg" cx="132" cy="125" r="12" />
</svg>
